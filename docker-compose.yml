services:
  dashboard:
    build: .
    ports:
      - "127.0.0.1:18080:18080"
    volumes:
      - ./data:/app/data
    environment:
      WEB_LOG_SQL_DB: data/dashboard.db
    command:
      - web-log-sql
      - serve
      - --db
      - data/dashboard.db
      - --host
      - 0.0.0.0
      - --port
      - "18080"
